[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ising-model-simulation"
version = "0.1.0"
description = "Computational statistical physics playground for Ising model simulations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba>=0.63",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
py-modules = [
    "animation",
    "creation",
    "evolution",
    "live_visualization",
    "main",
    "metropolis",
    "metropolis_numba",
    "nearest_neighbour",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]